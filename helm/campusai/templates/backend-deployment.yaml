apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: campusai-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: campusai-backend
  template:
    metadata:
      labels:
        app: campusai-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: campusai-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            - name: BEDROCK_MODEL_ID
              value: {{ .Values.aws.bedrockModelId | quote }}
            - name: BEDROCK_EMBEDDING_MODEL_ID
              value: {{ .Values.aws.bedrockEmbeddingModelId | quote }}
            - name: AWS_S3_BUCKET_DOCUMENTS
              value: {{ .Values.aws.s3Bucket | quote }}
            - name: AWS_BEDROCK_MOCK_FALLBACK
              value: "true"
            - name: LLM_PROVIDER
              value: {{ .Values.llmProvider | default "ollama" | quote }}
            - name: OLLAMA_BASE_URL
              value: {{ .Values.ollama.baseUrl | default "http://localhost:11434" | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.ollama.model | default "llama3.2" | quote }}
            - name: AWS_TRANSLATE_ENABLED
              value: "true"
            - name: DATABASE_URL
              value: "sqlite:////tmp/campusai.db"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: campusai-backend
