# Default values for campusai chart
environment: prod

backend:
  replicaCount: 2
  image:
    repository: 528233125980.dkr.ecr.us-east-1.amazonaws.com/campusai-backend
    pullPolicy: IfNotPresent
    tag: "e9f6a543cf756f01b1d0d94f749a61cd019d0e13"
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

frontend:
  replicaCount: 2
  image:
    repository: 528233125980.dkr.ecr.us-east-1.amazonaws.com/campusai-frontend
    pullPolicy: IfNotPresent
    tag: "e9f6a543cf756f01b1d0d94f749a61cd019d0e13"
  service:
    type: LoadBalancer
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

mcp:
  replicaCount: 1
  image:
    repository: 528233125980.dkr.ecr.us-east-1.amazonaws.com/campusai-mcp
    pullPolicy: IfNotPresent
    tag: "e9f6a543cf756f01b1d0d94f749a61cd019d0e13"
  service:
    type: ClusterIP
    port: 8001
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

ingress:
  enabled: false
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
  hosts:
    - host: campusai.cbit.ac.in
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend

aws:
  region: us-east-1
  bedrockModelId: "anthropic.claude-3-5-sonnet-20241022-v2:0"
  bedrockEmbeddingModelId: "amazon.titan-embed-text-v2:0"
  s3Bucket: "campusai-academic-cbit-528233125980"
  rdsEndpoint: "campusai-dev-db.cwluoowemh9a.us-east-1.rds.amazonaws.com:5432"
  eksClusterName: "campusai-cluster"
