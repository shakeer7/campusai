apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campusai-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: campusai
  source:
    repoURL: https://github.com/cbit-org/campusai.git
    targetRevision: main
    path: campusai/helm/campusai
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: campusai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
