name: CampusAI Deploy via GitHub Actions

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: write
  packages: write
  id-token: write

env:
  AWS_REGION: us-east-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================================================
  # Stage 1: Automated Test & Quality Verification
  # ============================================================================
  test-and-verify:
    name: Run Automated Tests & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend
          AWS_BEDROCK_MOCK_FALLBACK: "true"
        run: |
          pytest backend/tests -v --tb=short

  # ============================================================================
  # Stage 2: Container Image Build & Push to ECR / GHCR
  # ============================================================================
  build-and-push-images:
    name: Build & Push Production Containers
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Optional AWS ECR login (if AWS secrets configured in GitHub Repository)
      - name: Configure AWS Credentials (Optional)
        id: aws-auth
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        if: steps.aws-auth.outcome == 'success'
        continue-on-error: true
        uses: aws-actions/amazon-ecr-login@v2

      # GitHub Container Registry login as universal fallback
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Registry Target
        id: registry-meta
        run: |
          if [ "${{ steps.login-ecr.outcome }}" = "success" ]; then
            echo "REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
          else
            echo "REGISTRY=ghcr.io/${{ github.repository_owner }}" >> $GITHUB_ENV
          fi

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/campusai-backend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/campusai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/campusai-frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/campusai-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push MCP Server Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./mcp-server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/campusai-mcp:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/campusai-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 3: GitOps & Cloud Deployment
  # ============================================================================
  deploy:
    name: Deploy to Cloud & Update GitOps
    needs: build-and-push-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Helm GitOps Image Tags
        run: |
          sed -i "s/tag: .*/tag: \"${{ env.IMAGE_TAG }}\"/" helm/campusai/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/campusai/values.yaml
          git commit -m "chore(gitops): deploy image tag ${{ env.IMAGE_TAG }} [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped or branch protected"

      - name: Deployment Summary
        run: |
          echo "### 🚀 CampusAI Deployment Triggered via GitHub Actions" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Image**: \`${{ env.REGISTRY }}/campusai-backend:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Image**: \`${{ env.REGISTRY }}/campusai-frontend:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **MCP Server**: \`${{ env.REGISTRY }}/campusai-mcp:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Free Tier Status**: Verified Active ($0.00 infrastructure allocation)" >> $GITHUB_STEP_SUMMARY
