name: CampusAI CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r campusai/backend/requirements.txt

      - name: Run Pytest Suite with Coverage
        run: |
          cd campusai/backend
          pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=80

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
      - name: Terraform Format Check & Validate
        run: |
          cd campusai/infrastructure/terraform
          terraform init -backend=false
          terraform validate

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Lint Helm Chart
        run: |
          helm lint campusai/helm/campusai
